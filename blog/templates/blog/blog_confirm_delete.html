{% extends 'catalog/base.html' %}

{% block content %}
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Подтверждение удаления</h5>
          </div>
          <div class="card-body">
            <p class="lead">Вы действительно хотите удалить запись?</p>
            <h4>{{ object.title }}</h4>

            {% if object.image %}
              <img src="{{ object.image.url }}" class="img-thumbnail mb-3" style="max-width: 100%;" alt="{{ object.title }}">
            {% endif %}

            <p class="text-danger small">
              После удаления запись нельзя будет восстановить.
            </p>
            <form method="post">
              {% csrf_token %}
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'blog:blog_detail' object.pk %}" class="btn btn-secondary">Галя, отмена!</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
